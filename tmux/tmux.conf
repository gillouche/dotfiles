##### Login shell #####
set -g default-shell "$SHELL"
set -g default-command "$SHELL -l"

##### Terminal + Colors #####
set -g default-terminal "screen-256color"

##### Reload config #####
bind r source-file ~/.tmux.conf \; display-message "Reloaded tmux.conf"

##### Vi-mode + better search #####
setw -g mode-keys vi
set -g focus-events on

bind-key / command-prompt "send -X search-forward '%%'"
bind-key ? command-prompt "send -X search-backward '%%'"
bind-key n send -X search-again
bind-key N send -X search-reverse

##### Mouse + macOS clipboard #####
set -g mouse on
bind-key -Tcopy-mode-vi v send -X begin-selection
bind-key -Tcopy-mode-vi C-v send -X rectangle-toggle
bind-key -Tcopy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

##### Prefix #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Pane navigation (Ctrl + Arrow) — reliable everywhere #####
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

##### Window switching #####
bind -n S-Left  previous-window
bind -n S-Right next-window

##### Window/pane numbering #####
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

##### Status update speed #####
set -g status-interval 2

##### Split behavior (in current directory) #####
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

##### Faster ESC #####
set -sg escape-time 0

##### Disable aggressive resizing (recommended) #####
set -g aggressive-resize off

##### Pane resizing #####
# Prefix + Arrow keys for resizing (always works)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Option + Arrow (iTerm2 only — requires Esc+ mode)
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

##### Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @catppuccin_flavour 'mocha'

run '~/.tmux/plugins/tpm/tpm'
